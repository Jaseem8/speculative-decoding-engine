[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speculative-decoding-engine"
version = "0.1.0"
description = "Production-grade speculative decoding inference engine for accelerating LLM generation with provable distribution preservation."
readme = "README.md"
authors = [{ name = "Jaseem", email = "jaseemsabith@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
]
transformers = [
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
spec-decode = "speculative_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

